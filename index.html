/* ============================================================
   COMPENSATION PLANNING ACTIVITY
   Self-contained. No dependencies. Drop into GitHub Pages.
   Embed in Genially at 1160 x 640 (or anything down to ~900 wide).
   Everything scales to the iframe; nothing is ever clipped.
   ============================================================ */

*, *::before, *::after { box-sizing: border-box; }

html {
  /* The whole UI scales off this. Narrow iframe = smaller everything. */
  font-size: clamp(14px, 1.45vw, 18px);
  height: 100%;
}
body {
  margin: 0; height: 100%; overflow: hidden;   /* never scrolls as a page */
  font-family: "Segoe UI", Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif;
  color: #2F373B;
  background: #fff;
  -webkit-font-smoothing: antialiased;
}

:root{
  --green:#2E6B45;
  --green-deep:#28603E;
  --green-soft:#EAF2ED;
  --ink:#2F373B;
  --muted:#6E777B;
  /* Darker gray for secondary text that still needs to read easily:
     intro, meter sublabels, legend, job titles, guideline amounts,
     pay-position labels, notes. Deliberately dark gray, not black. */
  --muted-strong:#3A4246;
  --line:#E3E8E5;
  --tile:#F6F9F7;
  --amber:#B4761B;
  --amber-soft:#FBF1E1;
  --slate:#4A6070;
  --slate-soft:#ECF1F4;
  --danger:#B03A2E;
}

.app{ height:100%; display:flex; flex-direction:column; padding:.6rem 1.3rem .6rem; gap:.4rem; }

/* ---------- top bar: title + budget meters ---------- */
.topbar{ display:flex; align-items:flex-end; justify-content:space-between; gap:1.5rem; flex:0 0 auto; }
h1{ font-size:1.7rem; line-height:1.1; margin:0; color:var(--green); font-weight:800; letter-spacing:-.01em; }
.intro{ font-size:.92rem; color:var(--muted-strong); margin:.25rem 0 0; max-width:46rem; line-height:1.4; }

.meters{ display:flex; gap:.8rem; flex:0 0 auto; }
.meter{ background:var(--tile); border:1px solid var(--line); border-radius:.6rem; padding:.4rem .8rem .5rem; min-width:11rem; }
.meter .lab{ font-size:.68rem; letter-spacing:.1em; text-transform:uppercase; color:var(--green); font-weight:700; }
.meter .num{ font-size:1.75rem; font-weight:800; line-height:1.1; letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
.meter .num.over{ color:var(--danger); }
.meter .track{ height:.3rem; background:#DCE4DF; border-radius:99px; overflow:hidden; margin-top:.35rem; }
.meter .fill{ height:100%; background:var(--green); border-radius:99px; transition:width .18s ease; }
.meter .fill.over{ background:var(--danger); }
.meter .sub{ font-size:.68rem; color:var(--muted-strong); margin-top:.3rem; }

/* ---------- legend ---------- */
.legend{
  flex:0 0 auto; display:flex; align-items:center; gap:1.4rem; flex-wrap:wrap;
